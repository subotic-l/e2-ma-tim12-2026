plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

def loadLocalProperties() {
    def propsFile = rootProject.file('local.properties')
    def props = new Properties()
    if (propsFile.exists()) {
        propsFile.withInputStream { props.load(it) }
    }
    return props
}

def localProps = loadLocalProperties()

android {
    namespace 'com.example.slagalica'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.example.slagalica"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "CLOUDINARY_CLOUD_NAME",
                "\"${localProps.getProperty('cloudinary.cloud_name', '')}\""
        buildConfigField "String", "CLOUDINARY_API_KEY",
                "\"${localProps.getProperty('cloudinary.api_key', '')}\""
        buildConfigField "String", "CLOUDINARY_API_SECRET",
                "\"${localProps.getProperty('cloudinary.api_secret', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation "androidx.gridlayout:gridlayout:1.0.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.google.zxing:core:3.4.1"

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    implementation libs.glide
    implementation libs.cloudinary.android

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}